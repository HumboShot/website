name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: humboshot.com
  # Host key of the web server, pinned so the job fails on any other server.
  DEPLOY_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICNErLeQdZICwLAX0D9hzD6C2gZxChvAE8nBKhBjhdb2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "::error::Secret DEPLOY_SSH_KEY is not set"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$DEPLOY_HOST $DEPLOY_HOST_KEY" > ~/.ssh/known_hosts

      # The server limits the key to rsync writes inside the web root (rrsync -wo),
      # so the destination path is relative to the web root.
      # Checksums, not times: a fresh checkout gives every file a new mtime.
      - name: Sync site
        run: |
          rsync -rlc --delete --delay-updates --chmod=D755,F644 -i \
            --exclude '.git/' --exclude '.github/' --exclude '.vscode/' --exclude '.claude/' \
            --exclude 'README.md' --exclude 'publish.ps1' --exclude 'publish.cmd' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            ./ "deploy@$DEPLOY_HOST:"

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
