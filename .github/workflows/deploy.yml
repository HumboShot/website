name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for v in FTP_HOST FTP_USER FTP_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set"; exit 1; }
          done

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # The mirror deletes server files that are not in the repo. Excluded paths are kept,
      # so the exclude list also protects .well-known (SSL validation), .htaccess (cPanel
      # HTTPS redirect), cgi-bin and .ftpquota on the server.
      - name: Mirror site
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER" --env-password "ftp://$FTP_HOST" <<'EOF'
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 2
          set net:timeout 20
          mirror --reverse --delete --verbose --no-perms --exclude '^\.git/' --exclude '^\.github/' --exclude '^\.vscode/' --exclude '^\.claude/' --exclude '^README\.md$' --exclude '^publish\.(ps1|cmd)$' --exclude '^\.well-known/' --exclude '^\.htaccess$' --exclude '^cgi-bin/' --exclude '^\.ftpquota$' ./ ./
          bye
          EOF
