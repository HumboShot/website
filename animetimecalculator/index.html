<html>
    <head>
        <title>Anime Time Calculator</title>
        <meta charset="UTF-8">
        <link href="style.css" rel="stylesheet" />
        <link rel="icon" href="favicon.ico" type="image/x-icon">
        <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
        <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha256-pasqAKBDmFT4eHoN2ndd6lN370kFiGUFyTiUHWhU7k8=" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="header">
            <img class="img-valign" src="icon.png" height="38">
            <span class="webTitle">Anime Time Calculator</span>
        </div>
        <div class="search">
            <span>Made using the <a href="https://jikan.docs.apiary.io/#reference">Jikan API</a> as a weekend project</span>
            <input class="searchBar" type="text" id="searchBar">
            <input id="searchButton" type="button" value="Search">
        </div>
        <div class="timeCal">
            <b>Episodes already watched</b>
            <input class="episodesWatched" id="episodesWatched" type="number">
            <input id="calculateAlreadyWatchedTimeButton" type="button" value="Calculate">
            <br><b id="timeCal"></b>
        </div>
        <table class="table">
            <thead>
                <th class="cover-img">Cover</th>
                <th>Title</th>
                <th>Episodes</th>
                <th>Type</th>
                <th>Currently Airing</th>
            </thead>
            <tbody id="searchTableBody"></tbody>
        </table>
    </body>
    <script src="scripts.js"></script>
</html>
